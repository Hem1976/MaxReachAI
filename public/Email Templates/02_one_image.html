<!--
MAXREACH AI — PREMIUM EMAIL TEMPLATE
Editable tokens are wrapped in {{...}}.
Design direction: premium editorial/B2B, inspired by modern Canva email layouts:
strong typography, restrained palettes, gradients, layered cards, generous whitespace,
and visual hierarchy. Keep images hosted on HTTPS for email delivery.
-->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{EMAIL_SUBJECT}}</title></head>
<body style="margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#eef1f5;"><tr><td align="center" style="padding:30px 12px;">
<table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;">
<tr><td style="padding:0 6px 15px;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:#687587;">MAXPRO INFOTECH <span style="float:right;">{{CATEGORY}}</span></td></tr>
<tr><td style="background:#fff;border-radius:24px;overflow:hidden;border:1px solid #dce2e9;box-shadow:0 12px 40px rgba(20,31,48,.10);">
<!-- Image with colored editorial band -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="background:#1e3152;padding:10px 18px;font-size:10px;letter-spacing:2px;color:#dbe8ff;text-transform:uppercase;">{{IMAGE_LABEL}}</td></tr>
<tr><td><img src="{{HERO_IMAGE_URL}}" alt="{{HERO_IMAGE_ALT}}" width="640" style="display:block;width:100%;height:auto;border:0;"></td></tr></table>
<div style="padding:40px 44px 45px;background:linear-gradient(180deg,#ffffff 0%,#f7f9fb 100%);">
<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#4c79b7;margin-bottom:15px;">{{EYEBROW}}</div>
<h1 style="margin:0 0 19px;font-size:38px;line-height:1.08;letter-spacing:-1.4px;color:#111827;">{{HEADLINE}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:1.75;color:#394554;">Hi {{FIRST_NAME}},</p>
<p style="margin:0 0 16px;font-size:16px;line-height:1.8;color:#4c5866;">{{BODY_PARAGRAPH_1}}</p>
<p style="margin:0 0 28px;font-size:16px;line-height:1.8;color:#4c5866;">{{BODY_PARAGRAPH_2}}</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="background:#e8f3ff;border-left:4px solid #4c79b7;padding:16px 18px;font-size:13px;line-height:1.6;color:#31445b;"><strong>{{HIGHLIGHT_TITLE}}</strong><br>{{HIGHLIGHT_TEXT}}</td></tr></table>
<p style="margin:27px 0 0;"><a href="{{CTA_URL}}" style="display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:15px 23px;border-radius:9px;font-size:14px;font-weight:bold;">{{CTA_TEXT}} &nbsp;→</a></p>
<p style="margin:31px 0 0;font-size:13px;line-height:1.6;color:#6a7582;">{{SIGN_OFF}}<br><strong>{{SENDER_NAME}}</strong><br>{{SENDER_TITLE}} · Maxpro Infotech</p>
</div></td></tr></table></td></tr></table></body></html>
