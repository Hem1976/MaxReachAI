<!--
MAXREACH AI — PREMIUM EMAIL TEMPLATE
Editable tokens are wrapped in {{...}}.
Design direction: premium editorial/B2B, inspired by modern Canva email layouts:
strong typography, restrained palettes, gradients, layered cards, generous whitespace,
and visual hierarchy. Keep images hosted on HTTPS for email delivery.
-->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{EMAIL_SUBJECT}}</title></head>
<body style="margin:0;background:#ddd9d0;font-family:Georgia,'Times New Roman',serif;color:#171817;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ddd9d0;"><tr><td align="center" style="padding:34px 12px;">
<table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;">
<tr><td style="padding:0 5px 12px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:2.7px;text-transform:uppercase;color:#575c56;">MAXPRO INFOTECH <span style="float:right;">{{DATE}}</span></td></tr>
<tr><td style="height:2px;background:#252a27;"></td></tr>
<tr><td style="background:#f7f4ed;border:1px solid #cbc6bc;">
<div style="padding:43px 43px 0;">
<div style="font-family:Arial,sans-serif;display:inline-block;padding:7px 10px;border:1px solid #a9a59c;border-radius:3px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#595e58;">{{EYEBROW}}</div>
<h1 style="margin:21px 0 21px;font-size:45px;line-height:1.01;letter-spacing:-2px;font-weight:normal;color:#171817;">{{HEADLINE}}</h1>
<!-- Editable accent block -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="background:#202b2a;padding:13px 16px;color:#e9dfc6;font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;">{{ACCENT_LINE}}</td></tr></table>
<p style="margin:28px 0 16px;font-size:17px;line-height:1.8;">Hi {{FIRST_NAME}},</p>
<p style="margin:0 0 17px;font-size:17px;line-height:1.85;color:#333532;">{{BODY_PARAGRAPH_1}}</p>
<p style="margin:0 0 26px;font-size:17px;line-height:1.85;color:#333532;">{{BODY_PARAGRAPH_2}}</p>
</div>
<!-- Optional editorial image -->
<div style="padding:0 28px;"><img src="{{EDITORIAL_IMAGE_URL}}" alt="{{EDITORIAL_IMAGE_ALT}}" width="584" style="display:block;width:100%;height:auto;border:0;"></div>
<div style="padding:29px 43px 45px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="padding:20px 0;border-top:1px solid #b9b5ac;border-bottom:1px solid #b9b5ac;">
<div style="font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#777a73;margin-bottom:8px;">{{PULL_LABEL}}</div>
<div style="font-size:21px;line-height:1.45;">“{{PULL_QUOTE}}”</div>
</td></tr></table>
<p style="margin:27px 0 0;"><a href="{{CTA_URL}}" style="font-family:Arial,sans-serif;display:inline-block;background:#202b2a;color:#fff;text-decoration:none;padding:14px 22px;border-radius:4px;font-size:13px;font-weight:bold;">{{CTA_TEXT}} &nbsp;→</a></p>
<p style="margin:32px 0 0;font-family:Arial,sans-serif;font-size:13px;line-height:1.6;color:#656962;">{{SIGN_OFF}}<br><strong style="color:#20231f;">{{SENDER_NAME}}</strong><br>{{SENDER_TITLE}} · Maxpro Infotech</p>
</div></td></tr>
<tr><td style="padding:15px 3px;font-family:Arial,sans-serif;font-size:10px;line-height:1.5;color:#666a64;">{{FOOTER_TEXT}}</td></tr>
</table></td></tr></table></body></html>
