<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{EMAIL_SUBJECT}}</title></head>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#070b13;"><tr><td align="center" style="padding:34px 12px;">
<table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;">

<tr><td style="background:#101827;border:1px solid #27364a;border-radius:26px;overflow:hidden;">

<table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td style="background:#6fe1d1;border-radius:10px;">

</td></tr></table>
<div style="margin-top:38px;padding-top:20px;border-top:1px solid #273445;font-size:13px;line-height:1.7;color:#78879a;">{{SIGN_OFF}}<br><strong style="color:#dce3ea;">{{SENDER_NAME}}</strong><br>{{SENDER_TITLE}} · Maxpro Infotech</div>
</div></td></tr>
