<!--
MAXREACH AI — PREMIUM EMAIL TEMPLATE
Editable tokens are wrapped in {{...}}.
Design direction: premium editorial/B2B, inspired by modern Canva email layouts:
strong typography, restrained palettes, gradients, layered cards, generous whitespace,
and visual hierarchy. Keep images hosted on HTTPS for email delivery.
-->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{EMAIL_SUBJECT}}</title></head>
<body style="margin:0;background:#0b0e12;font-family:Arial,Helvetica,sans-serif;color:#fff;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#0b0e12;"><tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;">
<tr><td style="padding:0 8px 17px;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:#798595;">MAXPRO <span style="color:#d8aa62;">/</span> {{CATEGORY}}</td></tr>
<tr><td style="background:#151a21;border:1px solid #2b333e;border-radius:24px;overflow:hidden;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
<td width="50%" style="width:50%;padding:0;"><img src="{{IMAGE_1_URL}}" alt="{{IMAGE_1_ALT}}" width="320" style="display:block;width:100%;height:auto;border:0;"></td>
<td width="50%" style="width:50%;padding:0;"><img src="{{IMAGE_2_URL}}" alt="{{IMAGE_2_ALT}}" width="320" style="display:block;width:100%;height:auto;border:0;"></td>
</tr></table>
<div style="padding:42px 42px 45px;background:linear-gradient(145deg,#151a21,#11151b);">
<div style="font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#d8aa62;margin-bottom:14px;">{{EYEBROW}}</div>
<h1 style="margin:0 0 18px;font-size:38px;line-height:1.06;letter-spacing:-1.5px;">{{HEADLINE}}</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:1.75;color:#c3cbd5;">Hi {{FIRST_NAME}},</p>
<p style="margin:0 0 15px;font-size:16px;line-height:1.8;color:#b1bbc7;">{{BODY_PARAGRAPH_1}}</p>
<p style="margin:0 0 25px;font-size:16px;line-height:1.8;color:#9da8b5;">{{BODY_PARAGRAPH_2}}</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td style="padding:18px 0;border-top:1px solid #303945;border-bottom:1px solid #303945;">
<div style="font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#d8aa62;margin-bottom:7px;">{{HIGHLIGHT_LABEL}}</div>
<strong style="font-size:14px;color:#fff;">{{HIGHLIGHT_TITLE}}</strong><br><span style="font-size:13px;line-height:1.6;color:#7f8b9a;">{{HIGHLIGHT_TEXT}}</span>
</td></tr></table>
<p style="margin:28px 0 0;"><a href="{{CTA_URL}}" style="display:inline-block;color:#121212;background:#d8aa62;text-decoration:none;padding:14px 22px;border-radius:8px;font-size:14px;font-weight:bold;">{{CTA_TEXT}} &nbsp;→</a></p>
<p style="margin:31px 0 0;font-size:13px;line-height:1.6;color:#707d8d;">{{SIGN_OFF}}<br><strong style="color:#d8dee5;">{{SENDER_NAME}}</strong><br>{{SENDER_TITLE}} · Maxpro Infotech</p>
</div></td></tr>
<tr><td style="padding:17px 6px;font-size:10px;line-height:1.5;color:#596574;">{{FOOTER_TEXT}}</td></tr>
</table></td></tr></table></body></html>
