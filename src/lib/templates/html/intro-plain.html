<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#000000;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;"><tr><td align="center" class="mx-body-pad" style="padding:34px 12px;">
<table role="presentation" class="mx-shell" width="640" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;width:100%;">
<tr><td class="mx-logo-pad" style="padding:0 8px 18px;">
  <img src="{{LOGO_URL}}" alt="Maxpro Infotech" width="168" style="display:block;border:0;height:auto;max-width:180px;">
</td></tr>
<tr><td style="background:#ffffff;border:1px solid #dadce0;border-radius:8px;overflow:hidden;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td height="4" style="height:4px;background:#20a4b8;"></td></tr></table>
<div class="mx-content" style="padding:48px 46px 44px;background:#ffffff;">
<div data-slot="EYEBROW" style="display:inline-block;padding:7px 11px;border:1px solid #dadce0;border-radius:999px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#5f6368;">{{EYEBROW}}</div>
<h1 data-slot="HEADLINE" class="mx-headline" style="margin:23px 0 18px;font-size:43px;line-height:1.03;letter-spacing:-1.8px;font-weight:700;color:#000000;">{{HEADLINE}}</h1>
<p data-slot="GREETING" class="mx-copy" style="margin:0 0 19px;font-size:16px;line-height:1.75;color:#202124;">{{GREETING}}</p>
<p data-slot="INTRO" class="mx-copy" style="margin:0 0 16px;font-size:16px;line-height:1.8;color:#202124;">{{INTRO}}</p>
<p data-slot="FOLLOW" class="mx-copy" style="margin:0 0 30px;font-size:16px;line-height:1.8;color:#202124;">{{FOLLOW}}</p>
<table role="presentation" class="mx-cta" cellspacing="0" cellpadding="0" border="0"><tr><td style="background:#20a4b8;border-radius:4px;">
<a href="{{CTA_HREF}}" style="display:inline-block;padding:15px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;"><span data-slot="CTA_LABEL">{{CTA_LABEL}}</span> &nbsp;→</a>
</td></tr></table>
<div class="mx-signature" style="margin-top:38px;padding-top:20px;border-top:1px solid #dadce0;font-size:13px;line-height:1.7;color:#5f6368;">Best regards,<br><strong data-slot="SENDER_NAME" style="color:#000000;">{{SENDER_NAME}}</strong><br><span data-slot="SENDER_TITLE">{{SENDER_TITLE}}</span><br><span data-slot="COMPANY_NAME">{{COMPANY_NAME}}</span><br><a href="mailto:{{SENDER_EMAIL}}" style="color:#20a4b8;text-decoration:none;"><span data-slot="SENDER_EMAIL">{{SENDER_EMAIL}}</span></a><br><span data-slot="FOOTER_PHONE">{{FOOTER_PHONE}}</span></div>
</div></td></tr>
<tr><td class="mx-footer" style="padding:18px 7px;font-size:10px;line-height:1.5;color:#5f6368;">You received this message because we believe the information may be relevant to your business.</td></tr>
</table></td></tr></table>
</body></html>
